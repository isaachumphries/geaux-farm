project_id = "geaux_farm"

# Email sign-in is a 6-digit code (CM-04), not a link, so both templates that
# GoTrue can send for signInWithOtp show {{ .Token }}: magic_link for an
# existing account, confirmation for a first sign-in when "Confirm email" is
# on. Hosted projects keep their templates in the dashboard (see README,
# "Auth setup"); these entries only configure the local stack.
[auth.email]
otp_length = 6

[auth.email.template.magic_link]
subject = "Your Geaux Farm sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Your Geaux Farm sign-in code"
content_path = "./supabase/templates/magic_link.html"
